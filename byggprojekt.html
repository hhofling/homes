<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Byggplaneraren – planera renovering och bygge: moment, material, tid, kostnad, offertförfrågningar, inköpslistor och checklistor." />
    <title>Byggplaneraren</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23b4561d'/%3E%3Cpath d='M8 11h16M8 16h16M8 21h10' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="6" fill="#b4561d"/><path d="M8 11h16M8 16h16M8 21h10" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
        <span>Byggplaneraren</span>
      </div>
      <select id="project-select" class="project-select" aria-label="Välj projekt"></select>
      <button id="btn-new" title="Skapa ett nytt, tomt projekt">+ Nytt projekt</button>
      <span class="spacer"></span>
      <div class="top-actions">
        <button id="btn-open" title="Öppna en sparad projektfil (.json)">Öppna fil…</button>
        <button id="btn-save" title="Spara projektet som fil (.json)">Spara fil</button>
        <button id="btn-print" class="primary" title="Skriv ut det du ser">Skriv ut</button>
        <a id="link-tomt" class="tool-link tomt-link" href="./tomt.html" title="Rita tomt och hus i 3D">Tomt i 3D ↗</a>
        <a id="link-bilder" class="tool-link bilder-link" href="./bilder.html" title="Samla bilder, skissa på dem och be AI ändra dem">Bilder och AI ↗</a>
        <a id="link-planritaren" class="tool-link" href="./index.html" title="Öppna Planritaren">Planritaren ↗</a>
      </div>
      <input id="file-input" type="file" accept=".json,application/json" hidden />
      <input id="plan-file-input" type="file" accept=".json,application/json" hidden />
    </header>
    <div class="layout">
      <nav id="nav" class="nav" aria-label="Delar av projektet"></nav>
      <main id="main" class="main"></main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/projekt/main.ts"></script>
  </body>
</html>
