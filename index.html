<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Planritaren – rita planlösningar och prova inredningslösningar för ditt hem." />
    <title>Planritaren</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231d4f91'/%3E%3Cpath d='M7 25V9h18v16H7zm0-8h8v8' fill='none' stroke='white' stroke-width='2.5'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="6" fill="#1d4f91"/><path d="M7 25V9h18v16H7zm0-8h8v8" fill="none" stroke="white" stroke-width="2.5"/></svg>
        <span>Planritaren</span>
      </div>
      <input id="plan-name" class="plan-name" type="text" aria-label="Planens namn" />
      <div class="top-actions">
        <button id="btn-undo" title="Ångra (Ctrl+Z)">↶ Ångra</button>
        <button id="btn-redo" title="Gör om (Ctrl+Shift+Z)">↷ Gör om</button>
        <span class="sep"></span>
        <button id="btn-image" class="accent" title="Ladda upp en bild på en planritning och gör om den till en ritning">Från bild…</button>
        <button id="btn-3d" class="accent" title="Se planen i 3D">Visa i 3D</button>
        <span class="sep"></span>
        <button id="btn-open" title="Öppna en sparad planfil (.json)">Öppna fil…</button>
        <button id="btn-save" title="Spara planen som fil (.json)">Spara fil</button>
        <span class="sep"></span>
        <button id="btn-png" class="primary" title="Exportera som bild">Exportera PNG</button>
        <button id="btn-svg" title="Exportera som vektorbild">SVG</button>
        <button id="btn-print" title="Skriv ut">Skriv ut</button>
        <span class="sep"></span>
        <a id="link-tomt" class="tool-link tomt-link" href="./tomt.html" title="Rita tomt och hus i 3D">Tomt i 3D ↗</a>
        <a id="link-bygg" class="tool-link" href="./byggprojekt.html" title="Planera renovering eller bygge: moment, material, tid, offertförfrågningar och inköpslistor">Byggplaneraren ↗</a>
        <a id="link-bilder" class="tool-link bilder-link" href="./bilder.html" title="Samla bilder, skissa på dem och be AI ändra dem">Bilder och AI ↗</a>
        <input id="file-input" type="file" accept=".json,application/json" hidden />
      </div>
    </header>

    <div class="app">
      <aside class="panel left">
        <section>
          <h2>Verktyg</h2>
          <div class="tools" id="tools"></div>
        </section>
        <section>
          <h2>Inställningar</h2>
          <label class="row"><input type="checkbox" id="opt-snap" checked /> Fäst mot rutnät</label>
          <label class="row">Rutnät
            <select id="opt-grid">
              <option value="10">1 cm</option>
              <option value="50">5 cm</option>
              <option value="100" selected>10 cm</option>
              <option value="250">25 cm</option>
              <option value="500">50 cm</option>
            </select>
          </label>
          <label class="row">Väggtjocklek
            <span class="unit-input"><input type="number" id="opt-thickness" min="20" max="1000" step="10" value="150" /> mm</span>
          </label>
          <label class="row"><input type="checkbox" id="opt-walls" checked /> Skapa väggar runt nya rum</label>
          <h3>Visa</h3>
          <label class="row"><input type="checkbox" id="opt-lengths" checked /> Väggmått</label>
          <label class="row"><input type="checkbox" id="opt-areas" checked /> Rumsareor</label>
          <label class="row"><input type="checkbox" id="opt-furniture" checked /> Möbler</label>
        </section>
        <section id="bg-panel" hidden>
          <h2>Bakgrundsbild</h2>
          <label class="row"><input type="checkbox" id="bg-visible" checked /> Visa bilden</label>
          <label class="row">Synlighet
            <input type="range" id="bg-opacity" min="0.05" max="1" step="0.05" value="0.5" />
          </label>
          <button id="bg-remove">Ta bort bilden</button>
        </section>
        <section class="grow">
          <h2>Möbler &amp; inredning</h2>
          <input id="furniture-search" type="search" placeholder="Sök möbel…" aria-label="Sök möbel" />
          <div id="library" class="library"></div>
        </section>
      </aside>

      <main class="canvas-wrap">
        <svg id="canvas" xmlns="http://www.w3.org/2000/svg" data-tool="select" aria-label="Rityta"></svg>
        <div class="zoom">
          <button id="zoom-in" title="Zooma in">+</button>
          <button id="zoom-out" title="Zooma ut">−</button>
          <button id="zoom-fit" title="Anpassa till fönstret">⤢</button>
        </div>
        <div class="statusbar">
          <span id="status-hint"></span>
          <span class="spacer"></span>
          <span id="status-measure" class="measure"></span>
          <span id="status-cursor"></span>
          <span id="status-zoom"></span>
        </div>
      </main>

      <aside class="panel right">
        <section>
          <h2>Designlösningar</h2>
          <p class="muted small">Gör en variant för att prova en annan möblering eller planlösning utan att ändra originalet.</p>
          <ul id="plans" class="plans"></ul>
          <div class="btn-row">
            <button id="btn-new">+ Ny plan</button>
            <button id="btn-variant">Skapa variant</button>
          </div>
          <select id="example-select" class="example-select" aria-label="Lägg till ett exempel">
            <option value="">Öppna ett exempel…</option>
            <option value="hogbovagen333">Högbovägen 333, Sandviken</option>
          </select>
        </section>
        <section>
          <h2>Egenskaper</h2>
          <div id="props"></div>
        </section>
        <section>
          <h2>Sammanställning</h2>
          <div id="summary" class="summary"></div>
        </section>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
